name: Plugin compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
        dispatcharr:
          - version: '0.31.0'
            sha: bcbb68c4f054ee56383a41604cfcd7302b85da66
          - version: '0.33.0'
            sha: 2fa13a6707bdf0dae87e0c494bcd3ca282cdeb3e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out pinned native contract sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Dispatcharr/Dispatcharr
          ref: ${{ matrix.dispatcharr.sha }}
          path: .dispatcharr-contract
          persist-credentials: false
          sparse-checkout: |
            apps/channels/models.py
            apps/proxy/live_proxy/url_utils.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt ruff
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Check Python syntax and undefined names
        run: python -m ruff check --select E9,F63,F7,F82 plugin.py src scripts tests
      - name: Run regression and media tests
        run: python -m unittest discover -s tests -v
        env:
          TMS_REQUIRE_MEDIA_TESTS: '1'
          TMS_NATIVE_ROOT: ${{ github.workspace }}/.dispatcharr-contract
      - name: Build installable ZIP
        run: python scripts/build_plugin.py
      - name: Upload tested plugin
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: too-many-streams-dispatcharr-${{ matrix.dispatcharr.version }}-python-${{ matrix.python-version }}
          path: dist/too_many_streams.zip
          if-no-files-found: error
